# Runs the same checks as CI before every commit.
# Hooks are "local" so they use the ruff/mypy installed in your venv,
# meaning the versions always match pyproject.toml. Activate the venv before committing.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
