name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version to the end, so a failure shows which versions break.
      fail-fast: false
      matrix:
        # 3.11/3.12: what Kaggle and Colab run. 3.14: what the laptop runs.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # CPU-only torch first: CI has no GPU, and the default Linux wheel pulls ~3 GB of CUDA libs.
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      # Each step fails the job on a non-zero exit code. Never append `|| true`.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
