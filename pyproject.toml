[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tinyserve"
version = "0.0.1"
description = "A from-scratch LLM inference engine for small GPUs (T4)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.9",
    "safetensors>=0.4",
    "numpy>=1.26",  # safetensors.torch needs it to write bf16 tensors
    "tokenizers>=0.20",  # HF tokenizer library only (no modeling code)
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Reference implementation for correctness tests only; tinyserve never imports it.
    "transformers>=4.51",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "gpu: needs a CUDA GPU; skipped automatically on CPU-only machines",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Triton has no type information, and it is not installed on Windows: treat it as untyped
# everywhere so mypy gives the same answer on the laptop and in CI.
module = ["triton", "triton.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Triton reads a kernel's parameter annotations itself (tl.constexpr), so kernel
# parameters carry no ordinary type hints. Only this module relaxes those rules.
module = ["tinyserve.triton_attention"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
